
name: Build VOG Ambient FX VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout VOG source
        uses: actions/checkout@v4

      - name: Configure VST3 project
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build all four plugins
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4

      - name: Collect finished VST3 plugins
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null

          $plugins = Get-ChildItem build -Filter "*.vst3" -Recurse |
            Where-Object {
              $_.FullName -match '_artefacts[\\/]Release[\\/]VST3[\\/]'
            } |
            Sort-Object Name -Unique

          if ($plugins.Count -ne 4) {
            throw "Expected 4 VST3 plugins, found $($plugins.Count)"
          }

          foreach ($plugin in $plugins) {
            Copy-Item -LiteralPath $plugin.FullName `
              -Destination output -Recurse -Force
          }

      - name: Upload downloadable plugins
        uses: actions/upload-artifact@v4
        with:
          name: VOG-Ambient-FX-Windows-VST3
          path: output/
          if-no-files-found: error
